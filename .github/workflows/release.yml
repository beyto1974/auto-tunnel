name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release and upload its assets

jobs:
  release:
    name: build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CI only runs on pushes to main and on pull requests, so without this a
      # tag pushed to a broken commit would still ship.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist build
          # Linux and macOS only. auto-tunnel finds ssh-agent through
          # SSH_AUTH_SOCK, which Windows OpenSSH does not set, so a Windows
          # binary would ship with its documented auth path broken.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            echo "building $goos/$goarch"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o build/auto-tunnel .
            # The version is deliberately left out of the archive name so
            # /releases/latest/download/<name> resolves, which is what makes a
            # one-line curl install possible. The binary knows its own version.
            tar -czf "dist/auto-tunnel_${goos}_${goarch}.tar.gz" \
              -C build auto-tunnel \
              -C "$GITHUB_WORKSPACE" README.md
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
